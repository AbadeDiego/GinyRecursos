services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Defina a URL HTTPS pública da aplicação}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina o e-mail do administrador inicial}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina a senha inicial com 12 ou mais caracteres}
      DATABASE_PATH: /data/subvencao.sqlite
    volumes:
      - app_data:/data
      - app_backups:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
volumes:
  app_data:
  app_backups:
